[project]
name = "langchain-multi-agent-research-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kanchamcloud", email = "kancham.cloud@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.3",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
    "tavily-python>=0.8.1",
    "trafilatura>=2.2.0",
]

[project.scripts]
langchain-multi-agent-research-system = "langchain_multi_agent_research_system:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
